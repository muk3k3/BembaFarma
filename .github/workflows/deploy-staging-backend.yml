name: Deploy Staging - Backend Node.js

run-name: ${{ github.actor }} - Desplegando Backend a Staging

on:
  workflow_run:
    workflows: ["CI - Backend Node.js"] 
    types:
      - completed
    branches:
      - develop 

jobs:
  desplegar-backend-staging:
    runs-on: ubuntu-latest
    
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Crear o actualizar recursos AWS
        run: echo "Preparando recursos AWS mediante Terraform/CloudFormation para Staging."

      - name: Desplegar Backend
        run: echo "Desplegando Node.js en AWS Lambda y API Gateway (Staging)."

      - name: Pruebas de integración
        run: echo "Ejecutando pruebas sobre la URL de Staging."